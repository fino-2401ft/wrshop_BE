name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-wrshop-be
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, wrshop-be]
    timeout-minutes: 30
    steps:
      - name: Build and restart backend
        run: |
          set -euo pipefail
          cd /home/dev/wrshop_BE
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run db:push
          npm run build
          sudo /usr/bin/systemctl restart wrshop-be
          sudo /usr/bin/systemctl is-active --quiet wrshop-be
